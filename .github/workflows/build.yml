name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install ruby autoconf automake libtool
          gem install jekyll bundler

      - name: Build (Development, ad-hoc signed)
        run: |
          xcodebuild \
            -project fusepb/Fuse.xcodeproj \
            -scheme Fuse \
            -configuration Development \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Run Quick Look unit tests
        run: make test
