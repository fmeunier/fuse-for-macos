name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ruby/Jekyll dependencies
        run: |
          brew install ruby
          gem install jekyll bundler

      - name: Build (Development, ad-hoc signed)
        run: |
          xcodebuild \
            -project fusepb/Fuse.xcodeproj \
            -scheme Fuse \
            -configuration Development \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build
